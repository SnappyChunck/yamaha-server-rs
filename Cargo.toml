[package]
name = "yamaha-server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"]}

clap = { version = "4", features = ["derive"] }

mdns-sd = "0.20"

tokio-tungstenite = "0.29"


serde = { version = "1", features = ["derive"] }

serde_json = "1"

futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }